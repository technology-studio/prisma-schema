name: 'PR'

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  semantic-title:
    name: 'Semantic title'
    uses: technology-studio/github-workflows/.github/workflows/_semantic-title.yml@1e5321ebd14135cbc352a3f66df606d4824a95a7 # main
    secrets:
      TXO_SLACK_BOT_APP_TOKEN: ${{ secrets.TXO_SLACK_BOT_APP_TOKEN }}
      TXO_SLACK_GITHUB_OPS_CHANNEL_ID: ${{ secrets.TXO_SLACK_GITHUB_OPS_CHANNEL_ID }}
